
[cartographer]
mcu: cartographer
x_offset: 0     # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 22    # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: yes    # (False) For extra output

[cartographer scan]
#probe_speed: 5
#   Speed (in mm/s) of the Z axis when probing.
#   Constraints: minimum: 0.1
#mesh_runs: 1
#   Number of runs when doing a scan mesh. Consecutive runs will trace back the way it came from.
#mesh_height: 3
#   The height (in mm) of the head when doing a mesh run.
#   Constraints: minimum: 1
#mesh_direction: 'x'
#   Axis of which to do the most moves along.
#   Allowed values: x, y
#mesh_path: 'snake'
#   The path to use when calibrating a scan mesh.
#   Allowed values: snake, alternating_snake, spiral, random, hilbert
#mesh_max_corner_radius: None
#   Maximum corner radius (mm) for scan mesh path arcs. Omit or set to 'auto' to derive the radius from point spacing and axis limits; 0 disables smoothing arcs; positive values cap the auto-computed radius.

[cartographer touch]
samples: 3
#   The number of samples to use when doing a touch.
#   Constraints: minimum: 3
max_samples: 20     #10
#   The maximum number of samples to do before giving up.
#max_noisy_samples: 2
#   The number of noisy samples tolerated within the sliding window. The window size is calculated as samples + max_noisy_samples. A smaller value prevents cherry-picking good samples from a noisy sequence.
#   Constraints: minimum: 0
#UNSAFE_max_touch_temperature: 150
#   The maximum allowed nozzle temperature to use when touching the plate. This is set to 150C to avoid damaging your plate. Change this AT YOUR OWN RISK.
#EXPERIMENTAL_home_random_radius: 0.0
#   Radius around the Z home position to do touch.
#   Constraints: minimum: 0.0
#retract_distance: 2.0
#   Retract distance (in mm) between touch samples.
#   Constraints: minimum: 1.0
#sample_range: 0.01
#   Acceptable range (in mm) between touch samples.
#   Constraints: minimum: 0.001, maximum: 0.015

[bed_mesh]
zero_reference_position: 175, 175   # set this to the middle of your bed
speed: 500                          # movement speed of toolhead during bed mesh
horizontal_move_z: 3                # height of scanner during bed mesh scan
mesh_min: 40,50                     # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 320,320                   # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 30, 30
adaptive_margin: 10
mesh_pps: 0,0                       # Disable interpolation - mesh is probably dense enough

[cartographer coil]
#name: 'cartographer_coil'
#   The name of the coil temperature sensor.
#min_temp: 0
#   The minimum temperature of the coil, below this will trigger a warning.
#   Constraints: minimum: -273.15
#max_temp: 105
#   The maximum temperature of the coil, above this will trigger a warning.

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 105

[adxl345]
# utilise l'adxl de la sonde cartographer
cs_pin : cartographer:PA3
spi_bus : spi1
axes_map: z,-y,-x

[resonance_tester]
accel_chip: adxl345
probe_points: 175, 175, 20      # Fill out the blank with x and y coordinates where you want to run the resonance test.

[axis_twist_compensation]
#speed: 50
#   La vitesse (en mm/s) des mouvements sans palpage pendant la calibration.
#   La valeur par défaut est 50.
#horizontal_move_z: 5
#   La hauteur (en mm) à laquelle la tête doit se déplacer
#   juste avant de commencer une opération de palpage. La valeur par défaut est 5.
calibrate_start_x: 30
#   Définit la coordonnée X minimale de la calibration
#   Ce doit être la coordonnée X qui positionne la buse à la position de départ
#   de la calibration.
calibrate_end_x: 320
#   Définit la coordonnée X maximale de la calibration
#   Ce doit être la coordonnée X qui positionne la buse à la position de fin
#   de la calibration.
calibrate_y: 175
#   Définit la coordonnée Y de la calibration
#   Ce doit être la coordonnée Y qui positionne la buse pendant le
#   processus de calibration. Il est recommandé que ce paramètre soit
#   proche du centre du plateau.

# Pour la compensation de torsion de l'axe Y, spécifiez les paramètres suivants :
calibrate_start_y: 30
#   Définit la coordonnée Y minimale de la calibration
#   Ce doit être la coordonnée Y qui positionne la buse à la position de départ
#   de la calibration pour l'axe Y. Ce paramètre doit être fourni si vous
#   compensez la torsion de l'axe Y.
calibrate_end_y: 320
#   Définit la coordonnée Y maximale de la calibration
#   Ce doit être la coordonnée Y qui positionne la buse à la position de fin
#   de la calibration pour l'axe Y. Ce paramètre doit être fourni si vous
#   compensez la torsion de l'axe Y.
calibrate_x: 175
#   Définit la coordonnée X de la calibration pour la compensation de torsion de l'axe Y
#   Ce doit être la coordonnée X qui positionne la buse pendant le
#   processus de calibration pour la compensation de torsion de l'axe Y. Ce paramètre doit être
#   fourni et il est recommandé qu'il soit proche du centre du plateau.

# Les paramètres suivants sont automatiquement enregistrés par SAVE_CONFIG après
# l'exécution de AXIS_TWIST_COMPENSATION_CALIBRATE et ne doivent généralement pas être
# modifiés manuellement. Remarque : si z_compensations est défini, compensation_start_x
# et compensation_end_x doivent également l'être. De même, zy_compensations
# nécessite compensation_start_y et compensation_end_y.
#z_compensations:
#   Une liste séparée par des virgules de valeurs de compensation du décalage Z pour la torsion de l'axe X.
#   Elles représentent les ajustements Z à des points équidistants de
#   compensation_start_x à compensation_end_x. Généré automatiquement
#   pendant la calibration de l'axe X. Nécessite que compensation_start_x et
#   compensation_end_x soient définis. La valeur par défaut est une liste vide.
#compensation_start_x:
#   La coordonnée X de départ pour la compensation de torsion de l'axe X.
#   Définie automatiquement pendant la calibration. Par défaut, non défini.
#compensation_end_x:
#   La coordonnée X de fin pour la compensation de torsion de l'axe X.
#   Définie automatiquement pendant la calibration. Par défaut, non défini.
#zy_compensations:
#   Une liste séparée par des virgules de valeurs de compensation du décalage Z pour la torsion de l'axe Y.
#   Similaire à z_compensations mais pour l'axe Y. Généré automatiquement
#   pendant la calibration de l'axe Y (AXIS=Y). Nécessite que compensation_start_y et
#   compensation_end_y soient définis. La valeur par défaut est une liste vide.
#compensation_start_y:
#   La coordonnée Y de départ pour la compensation de torsion de l'axe Y.
#   Définie automatiquement pendant la calibration de l'axe Y. Par défaut, non défini.
#compensation_end_y:
#   La coordonnée Y de fin pour la compensation de torsion de l'axe Y.
#   Définie automatiquement pendant la calibration de l'axe Y. Par défaut, non défini.


